<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Campus Event Management{% endblock %}</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --primary-dark: #3730a3;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f59e0b;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ── Navbar ── */
    nav {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      padding: 0 2rem;
      display: flex;
      align-items: center;
      height: 64px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav .brand {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      margin-right: 2rem;
      white-space: nowrap;
    }
    nav .brand span { color: var(--primary-light); }
    nav .links { display: flex; gap: .25rem; flex-wrap: wrap; }
    nav .links a {
      color: rgba(255,255,255,.85);
      text-decoration: none;
      padding: .45rem .9rem;
      border-radius: 6px;
      font-size: .9rem;
      transition: background .2s, color .2s;
    }
    nav .links a:hover,
    nav .links a.active {
      background: rgba(255,255,255,.15);
      color: #fff;
    }

    /* ── Layout ── */
    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* ── Flash Messages ── */
    .flash {
      padding: .75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: .95rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .flash.success { background: #dcfce7; color: #166534; border-left: 4px solid var(--success); }
    .flash.danger  { background: #fee2e2; color: #991b1b; border-left: 4px solid var(--danger); }
    .flash.warning { background: #fef3c7; color: #92400e; border-left: 4px solid var(--warning); }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }
    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: var(--primary-dark);
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: .5rem;
    }

    /* ── Tables ── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem;
    }
    th {
      background: var(--primary);
      color: #fff;
      padding: .65rem .75rem;
      text-align: left;
      font-weight: 600;
    }
    th:first-child { border-radius: 8px 0 0 0; }
    th:last-child  { border-radius: 0 8px 0 0; }
    td {
      padding: .6rem .75rem;
      border-bottom: 1px solid var(--border);
    }
    tr:hover td { background: #f8fafc; }

    /* ── Forms ── */
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: .3rem;
      font-size: .9rem;
      color: var(--text);
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: .55rem .75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .95rem;
      transition: border-color .2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: .55rem 1.25rem;
      border: none;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
      text-decoration: none;
      color: #fff;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--primary); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #15803d; }
    .btn-danger  { background: var(--danger); }
    .btn-danger:hover  { background: #b91c1c; }
    .btn-sm { padding: .35rem .75rem; font-size: .8rem; }

    /* ── Stats Grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .stat-card .number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
    }
    .stat-card .label {
      font-size: .85rem;
      color: var(--muted);
      margin-top: .25rem;
    }

    /* ── Graph images ── */
    .graph-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    .graph-card { text-align: center; }
    .graph-card img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: .5rem; }

    @media (max-width: 640px) {
      nav { flex-direction: column; height: auto; padding: .75rem 1rem; }
      nav .links { margin-top: .5rem; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a href="{{ url_for('index') }}" class="brand">🎓 Campus <span>Events</span></a>
  <div class="links">
    <a href="{{ url_for('events_page') }}" {% if request.path.startswith('/events') %}class="active"{% endif %}>Events</a>
    <a href="{{ url_for('students_page') }}" {% if request.path.startswith('/students') %}class="active"{% endif %}>Students</a>
    <a href="{{ url_for('register_page') }}" {% if request.path == '/register' %}class="active"{% endif %}>Registration</a>
    <a href="{{ url_for('search_registrations') }}" {% if request.path == '/register/search' %}class="active"{% endif %}>🔍 Search</a>
    <a href="{{ url_for('feedback_page') }}" {% if request.path == '/feedback' %}class="active"{% endif %}>Feedback</a>
    <a href="{{ url_for('analysis_page') }}" {% if request.path == '/analysis' %}class="active"{% endif %}>📊 Analysis</a>
  </div>
</nav>

<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

</body>
</html>
