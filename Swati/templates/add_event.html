{% extends "base.html" %}
{% block title %}Add Event — Campus Events{% endblock %}
{% block content %}

<h1 style="margin-bottom:1.5rem;">➕ Create New Event</h1>

<div class="card" style="max-width:600px;">
  <form method="post">
    <div class="form-row">
      <div class="form-group">
        <label>Event ID</label>
        <input type="text" name="event_id" placeholder="E001" required>
      </div>
      <div class="form-group">
        <label>Event Name</label>
        <input type="text" name="name" placeholder="Tech Fest 2026" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" name="date" required>
      </div>
      <div class="form-group">
        <label>Venue</label>
        <input type="text" name="venue" placeholder="Main Auditorium" required>
      </div>
    </div>
    <div class="form-group">
      <label>Maximum Participants</label>
      <input type="number" name="max_participants" min="1" value="50" required>
    </div>
    <button type="submit" class="btn btn-primary">Create Event</button>
    <a href="{{ url_for('events_page') }}" class="btn btn-danger" style="margin-left:.5rem;">Cancel</a>
  </form>
</div>

{% endblock %}
